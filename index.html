<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050507"
    >

    <meta
        name="description"
        content="commander04 profile"
    >

    <title>commander04</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         BACKGROUND VIDEO
    ================================================== -->

    <div
        class="background-container"
        aria-hidden="true"
    >

        <video
            id="background-video"
            class="background-video"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
            poster="assets/background/background.jpg"
        >

            <source
                src="assets/background/background.mp4"
                type="video/mp4"
            >

        </video>

    </div>



    <!-- =================================================
         ENTER SCREEN
    ================================================== -->

    <div
        id="enter-screen"
        class="enter-screen"
    >

        <div class="enter-content">

            <div
                id="enter-name"
                class="enter-name"
            >
                commander04
            </div>


            <button
                id="enter-button"
                class="enter-button"
                type="button"
            >
                CLICK TO ENTER
            </button>

        </div>

    </div>



    <!-- =================================================
         MAIN SITE
    ================================================== -->

    <main
        id="main-site"
        class="main-site"
    >


        <!-- =================================================
             PROFILE
        ================================================== -->

        <section
            id="profile"
            class="profile"
        >

            <div class="profile-card">


                <!-- Avatar -->

                <div class="avatar-container">

                    <img
                        id="profile-avatar"
                        class="profile-avatar"
                        src=""
                        alt="Profile"
                        loading="eager"
                    >

                </div>


                <!-- Name -->

                <h1
                    id="profile-name"
                    class="profile-name"
                >
                    commander04
                </h1>


                <!-- Username -->

                <div
                    id="profile-username"
                    class="profile-username"
                >
                    @commander04
                </div>


                <!-- Bio -->

                <p
                    id="profile-bio"
                    class="profile-bio"
                >
                    Programmer • Editor • Creator
                </p>


                <!-- Location -->

                <div
                    id="profile-location"
                    class="profile-location"
                >
                    Iran 🇮🇷
                </div>


                <!-- Status -->

                <div
                    id="profile-status"
                    class="profile-status"
                >

                    <span class="status-dot"></span>

                    <span id="status-text">
                        Online
                    </span>

                </div>



                <!-- =================================================
                     SOCIAL LINKS
                ================================================== -->

                <div
                    id="social-links"
                    class="social-links"
                >

                    <a
                        id="github-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        GitHub
                    </a>


                    <a
                        id="discord-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Discord
                    </a>


                    <a
                        id="instagram-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Instagram
                    </a>


                    <a
                        id="telegram-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Telegram
                    </a>


                    <a
                        id="bale-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Bale
                    </a>

                </div>



                <!-- =================================================
                     MUSIC PLAYER
                ================================================== -->

                <div
                    id="music-player"
                    class="music-player"
                >

                    <div class="music-info">

                        <span
                            id="music-title"
                            class="music-title"
                        >
                            My Song
                        </span>


                        <span
                            id="music-artist"
                            class="music-artist"
                        >
                            Unknown Artist
                        </span>

                    </div>


                    <div class="music-controls">

                        <button
                            id="music-button"
                            class="music-button"
                            type="button"
                            aria-label="Play or pause music"
                        >
                            ▶
                        </button>


                        <div
                            class="music-progress"
                            aria-hidden="true"
                        >

                            <div
                                id="music-progress-bar"
                                class="music-progress-bar"
                            ></div>

                        </div>

                    </div>

                </div>



                <!-- =================================================
                     NEXT PAGE
                ================================================== -->

                <button
                    id="next-page"
                    class="next-page"
                    type="button"
                >

                    NEXT PAGE

                    <span>
                        →
                    </span>

                </button>

            </div>

        </section>



        <!-- =================================================
             SECOND PAGE
        ================================================== -->

        <section
            id="page-two"
            class="page-two"
        >

            <div class="page-content">


                <div class="page-label">
                    PAGE 02
                </div>


                <h2>
                    ABOUT ME
                </h2>


                <p
                    id="about-text"
                    class="about-text"
                >
                    Welcome to my profile.
                </p>



                <!-- Projects -->

                <div class="projects">

                    <h3>
                        PROJECTS
                    </h3>


                    <div
                        id="project-list"
                        class="project-list"
                    ></div>

                </div>



                <!-- Back -->

                <button
                    id="back-page"
                    class="back-page"
                    type="button"
                >
                    ← BACK
                </button>

            </div>

        </section>


    </main>



    <!-- =================================================
         AUDIO
    ================================================== -->

    <audio
        id="background-music"
        preload="auto"
    ></audio>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script src="config.js"></script>

    <script src="script.js"></script>


</body>

</html>
